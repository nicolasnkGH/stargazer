name: Stargazer Enterprise Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'nextjs-app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'package.json'
      - 'requirements*.txt'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'nextjs-app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'package.json'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run"
        required: true
        type: choice
        default: deploy
        options:
          - validate
          - deploy
          - release
          - rollback
      version:
        description: "Release version (X.Y.Z). If empty for action=release, patch version is auto-incremented."
        required: false
        type: string
      target_branch:
        description: "Branch to use for manual validate/deploy/release"
        required: false
        default: main
        type: string
      target_tag:
        description: "Tag to rollback to (required for action=rollback)"
        required: false
        type: string
      reason:
        description: "Rollback reason"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview only for manual runs (no deploy, no tag push, no release publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: stargazer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && contains('validate deploy release', github.event.inputs.action))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          echo "Checking JS files in web/..."
          ERRORS=0
          for f in web/*.js; do
            node --check "$f" && echo "OK $f" || { echo "ERROR: syntax error in $f"; ERRORS=$((ERRORS+1)); }
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS JS file(s) with syntax errors."
            exit 1
          fi

      - name: HTML critical element checks
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('web/index.html', 'utf8');
            const required = [
              'card-motion', 'card-targets',
              'scheduler-list-container', 'scheduler-empty-state',
              'scheduler-timeline-bar'
            ];
            let errors = 0;
            required.forEach(id => {
              if (!html.includes('id=\"' + id + '\"')) {
                console.error('Missing required element #' + id);
                errors++;
              } else {
                console.log('OK #' + id);
              }
            });
            if (errors > 0) process.exit(1);
          "

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install flake8 bandit
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt
          fi

      - name: Lint Python (critical errors)
        run: |
          set -euo pipefail
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Python security scan
        run: |
          set -euo pipefail
          bandit -r api/ -x api/venv -ll -ii -s B104

      - name: Install JS dependencies and browser
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI smoke tests and performance gate
        env:
          CI: true
        run: |
          set -euo pipefail
          npx serve web/ -p 3000 --no-clipboard &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 4

          # 1) Functional smoke tests (must pass)
          npx playwright test tests/smoke.spec.js --reporter=line

          # 2) Performance and quality signal (warning-only)
          cat > /tmp/lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": ["http://127.0.0.1:3000/"],
                "numberOfRuns": 2,
                "settings": {
                  "preset": "desktop",
                  "chromeFlags": "--no-sandbox --disable-dev-shm-usage"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.65 }],
                  "categories:best-practices": ["warn", { "minScore": 0.75 }],
                  "categories:accessibility": ["warn", { "minScore": 0.75 }]
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "./lighthouseci"
              }
            }
          }
          EOF
          npx lhci autorun --config=/tmp/lighthouserc.json

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouseci/
          retention-days: 7

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}

      - name: Copy package.json to API directory
        run: cp package.json api/package.json

      - name: Validate deployment configuration
        env:
          GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || secrets.GCP_SERVICE_NAME }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_SOURCE_DIR: ${{ vars.GCP_SOURCE_DIR }}
          CLOUD_RUN_EXECUTION_ENV: ${{ vars.CLOUD_RUN_EXECUTION_ENV }}
          CLOUD_RUN_DB_VOLUME: ${{ vars.CLOUD_RUN_DB_VOLUME }}
          CLOUD_RUN_DB_BUCKET: ${{ vars.CLOUD_RUN_DB_BUCKET }}
          CLOUD_RUN_DB_MOUNT_PATH: ${{ vars.CLOUD_RUN_DB_MOUNT_PATH }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FALLBACK_AI_API_URL: ${{ vars.FALLBACK_AI_API_URL }}
          FALLBACK_AI_MODEL: ${{ vars.FALLBACK_AI_MODEL }}
          FALLBACK_AI_API_KEY: ${{ secrets.FALLBACK_AI_API_KEY }}
          AI_TIMEOUT: ${{ vars.AI_TIMEOUT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
          NASA_APOD_KEY: ${{ secrets.NASA_APOD_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          required=(
            GCP_SERVICE_NAME
            GCP_REGION
            GCP_SOURCE_DIR
            CLOUD_RUN_EXECUTION_ENV
            CLOUD_RUN_DB_VOLUME
            CLOUD_RUN_DB_BUCKET
            CLOUD_RUN_DB_MOUNT_PATH
            GCP_SA_KEY
            AI_MODEL
            AI_API_URL
            AI_API_KEY
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            AI_TIMEOUT
          )

          optional=(
            FALLBACK_AI_API_URL
            FALLBACK_AI_MODEL
            FALLBACK_AI_API_KEY
            VAPID_PRIVATE_KEY
            VAPID_PUBLIC_KEY
            VAPID_ADMIN_EMAIL
            NASA_APOD_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
          )

          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub secret/variable: $key"
              missing=1
            fi
          done

          for key in "${optional[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::warning::Optional value is empty: $key"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Dry-run deploy preview
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          set -euo pipefail
          echo "Dry run mode enabled."
          echo "Would deploy service: ${{ vars.GCP_SERVICE_NAME || secrets.GCP_SERVICE_NAME }}"
          echo "Would deploy region: ${{ vars.GCP_REGION }}"
          echo "Would deploy source: ${{ vars.GCP_SOURCE_DIR }}"

      - name: Google Auth
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy_cloud_run
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_SERVICE_NAME || secrets.GCP_SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          source: ${{ vars.GCP_SOURCE_DIR }}
          flags: >-
            --execution-environment=${{ vars.CLOUD_RUN_EXECUTION_ENV }}
            --add-volume=name=${{ vars.CLOUD_RUN_DB_VOLUME }},type=cloud-storage,bucket=${{ vars.CLOUD_RUN_DB_BUCKET }}
            --add-volume-mount=volume=${{ vars.CLOUD_RUN_DB_VOLUME }},mount-path=${{ vars.CLOUD_RUN_DB_MOUNT_PATH }}
          env_vars: |-
            DB_DIR=${{ vars.CLOUD_RUN_DB_MOUNT_PATH }}
            AI_MODEL=${{ secrets.AI_MODEL }}
            AI_API_URL=${{ secrets.AI_API_URL }}
            AI_API_KEY=${{ secrets.AI_API_KEY }}
            CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            FALLBACK_AI_API_URL=${{ vars.FALLBACK_AI_API_URL }}
            FALLBACK_AI_MODEL=${{ vars.FALLBACK_AI_MODEL }}
            FALLBACK_AI_API_KEY=${{ secrets.FALLBACK_AI_API_KEY }}
            AI_TIMEOUT=${{ vars.AI_TIMEOUT }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_ADMIN_EMAIL=${{ secrets.VAPID_ADMIN_EMAIL }}
            NASA_APOD_KEY=${{ secrets.NASA_APOD_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Post-deploy health check
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          BASE_URL="${{ steps.deploy_cloud_run.outputs.url }}"
          if [ -z "$BASE_URL" ]; then
            echo "Cloud Run URL output not found from deploy step."
            exit 1
          fi

          HEALTH_URL="${BASE_URL%/}/health"
          echo "Checking $HEALTH_URL"
          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$BASE_URL")"
          if [ -z "$ID_TOKEN" ]; then
            echo "Unable to mint identity token for Cloud Run health check."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer $ID_TOKEN" \
              "$HEALTH_URL" >/tmp/health.json; then
              echo "Health check passed on attempt $attempt"
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check failed (attempt $attempt). Retrying..."
            sleep 5
          done

          echo "Health endpoint failed after retries: $HEALTH_URL"
          exit 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: >
      always() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' &&
       needs.deploy.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}"
          LAST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must be X.Y.Z (got '$INPUT_VERSION')"
              exit 1
            fi
            NEW_VERSION="$INPUT_VERSION"
          else
            CURRENT=${LAST_TAG#v}
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Release dry-run preview
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          set -euo pipefail
          echo "Dry run mode enabled."
          echo "Would create tag: v${{ steps.version.outputs.new_version }}"
          echo "Would create GitHub Release: Release v${{ steps.version.outputs.new_version }}"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.last_tag }}" = "v0.0.0" ]; then
            LOG=$(git log --pretty=format:"%h %s (%an, %ad)" --date=short)
          else
            LOG=$(git log --pretty=format:"%h %s (%an, %ad)" --date=short "${{ steps.version.outputs.last_tag }}"..HEAD)
          fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git tag -l "v${{ steps.version.outputs.new_version }}" | grep -q .; then
            echo "Tag v${{ steps.version.outputs.new_version }} already exists."
          else
            git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
            git push origin "v${{ steps.version.outputs.new_version }}"
          fi

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          body: |
            ## Changes since last release

            ```
            ${{ steps.changelog.outputs.log }}
            ```
          generate_release_notes: true
          draft: false
          prerelease: false

  rollback:
    name: Create Rollback PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate rollback input
        run: |
          set -euo pipefail
          if [ -z "${{ github.event.inputs.target_tag }}" ]; then
            echo "target_tag is required when action=rollback"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate target tag exists
        run: |
          set -euo pipefail
          if ! git rev-parse "${{ github.event.inputs.target_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.target_tag }} not found"
            exit 1
          fi

      - name: Verify target is annotated release tag
        run: |
          set -euo pipefail
          TYPE=$(git cat-file -t "${{ github.event.inputs.target_tag }}" 2>/dev/null)
          if [ "$TYPE" != "tag" ]; then
            echo "${{ github.event.inputs.target_tag }} is not an annotated tag"
            exit 1
          fi

      - name: Create rollback PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROLLBACK_BRANCH="rollback-$(date +%Y%m%d)-${{ github.event.inputs.target_tag }}"
          git checkout -b "$ROLLBACK_BRANCH" "${{ github.event.inputs.target_tag }}"
          git push origin "$ROLLBACK_BRANCH"

          REASON="${{ github.event.inputs.reason }}"
          if [ -z "$REASON" ]; then
            REASON="Rolling back to ${{ github.event.inputs.target_tag }} due to issues in current main"
          fi

          PR_TITLE="Rollback to ${{ github.event.inputs.target_tag }}"
          PR_BODY=$(cat <<EOF
          ## Rollback to ${{ github.event.inputs.target_tag }}

          **Reason:** $REASON

          This PR resets main to the state at tag ${{ github.event.inputs.target_tag }}.

          ### What this does
          - Reverts all commits since ${{ github.event.inputs.target_tag }}
          - Restores the codebase to a known-good state
          - Triggers a fresh deployment via this pipeline after merge

          ### After merge
          - Monitor health checks at /health to confirm stability
          EOF
          )

          PR_URL=$(gh pr create \
            --base main \
            --head "$ROLLBACK_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: 'echo "Rollback PR created: ${{ steps.pr.outputs.url }}"'
