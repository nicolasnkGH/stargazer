name: Deploy Stargazer CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Run all validation & tests
    uses: ./.github/workflows/validate.yml

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == true)) &&
      !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - name: Copy package.json to API directory
        run: cp package.json api/package.json

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME }}
          region: us-central1
          source: api/
          flags: '--execution-environment=gen2'
          env_vars: |-
            DB_DIR=/mnt/db
          volumes: |-
            name: db-vol,type: cloud-storage,bucket: stargazer-db-planar-flux-497402-g5
          volume_mounts: |-
            name: db-vol,mountPath: /mnt/db

  deploy-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update version in API
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update API version
          sed -i "s/version=\"[0-9]*\.[0-9]*\.[0-9]*\"/version=\"${VERSION#v}\"/" api/main.py

      - name: Copy package.json to API directory
        run: cp package.json api/package.json

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME }}
          region: us-central1
          source: api/
          flags: '--execution-environment=gen2'
          env_vars: |-
            DB_DIR=/mnt/db
          volumes: |-
            name: db-vol,type: cloud-storage,bucket: stargazer-db-planar-flux-497402-g5
          volume_mounts: |-
            name: db-vol,mountPath: /mnt/db
