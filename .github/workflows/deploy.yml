name: Deploy Stargazer

# Deploys only after the Validate & Test workflow succeeds on main.
# This ensures only validated code ever reaches production.
on:
  workflow_run:
    workflows: ["Validate & Test"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloud Run
    # Only deploy when validation passed AND it ran against the main branch
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy package.json to API directory
        run: cp package.json api/package.json

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME }}
          region: us-central1
          source: api/
          flags: '--execution-environment=gen2'
          env_vars: |-
            DB_DIR=/mnt/db
          volumes: |-
            name: db-vol,type: cloud-storage,bucket: stargazer-db-planar-flux-497402-g5
          volume_mounts: |-
            name: db-vol,mountPath:/mnt/db
