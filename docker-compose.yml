version: "3.9"

services:
  stargazer-api:
    build: ./api
    container_name: stargazer-api
    restart: unless-stopped
    ports:
      - "8181:8181"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - skyfield_data:/app/.skyfield
      - ./package.json:/app/package.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  stargazer-nextjs:
    build: ./nextjs-app
    container_name: stargazer-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Next.js standalone server binds to $HOSTNAME by default, which Docker
      # sets to the container id — that made it listen on the container IP
      # only, breaking the localhost healthcheck. Force all interfaces.
      - HOSTNAME=0.0.0.0
      - API_BACKEND=http://stargazer-api:8181
    depends_on:
      - stargazer-api
    healthcheck:
      # Use 127.0.0.1 explicitly: busybox wget tries ::1 for "localhost" first
      # and the Next.js server only listens on IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: stargazer-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  skyfield_data:
